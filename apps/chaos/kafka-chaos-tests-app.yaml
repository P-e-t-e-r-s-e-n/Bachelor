apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-chaos-tests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/P-e-t-e-r-s-e-n/Bachelor.git
    targetRevision: HEAD
    path: chaos-experiments
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    syncOptions:
      - CreateNamespace=false