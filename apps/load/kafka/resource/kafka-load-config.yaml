apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-load-script
  namespace: kafka

data:
  producer.sh: |
    #!/bin/bash
    set -e

    TOPIC="${TOPIC:-load-test-topic}"
    BROKER="${BROKER:-kafka-cluster-kafka-bootstrap:9092}"
    SCENARIO="${SCENARIO:-normal}"

    THROUGHPUT="${THROUGHPUT:--1}"
    RECORD_SIZE="${RECORD_SIZE:-1024}"
    NUM_RECORDS="${NUM_RECORDS:-10000000}"

    echo "Starting Kafka load test"
    echo "Scenario: ${SCENARIO}"
    echo "Broker: ${BROKER}"
    echo "Topic: ${TOPIC}"

    ########################################
    # BREAKDOWN SCENARIO (Optimiert)
    ########################################
    if [ "$SCENARIO" = "breakdown" ]; then
        echo "Running BREAKDOWN scenario"
        RATE=1000
        
        while true
        do
            echo "Current throughput: $RATE msg/s"
            
            # WICHTIG: KEIN '&' am Ende. --duration sorgt für die Laufzeit.
            /opt/kafka/bin/kafka-producer-perf-test.sh \
              --topic "${TOPIC}" \
              --duration 40 \
              --throughput "${RATE}" \
              --record-size "${RECORD_SIZE}" \
              --command-config /dev/null \
              --producer-props acks=1 bootstrap.servers="${BROKER}"
              
            # Ein kurzes Verschnaufen für den Cluster vor der nächsten Stufe
            sleep 5 
            
            RATE=$((RATE * 2))
            if [ "$RATE" -gt 64000 ]; then
                echo "Max rate reached, stopping breakdown"
                break
            fi
        done
        exit 0
    fi

    ########################################
    # ELSE: DEFAULT 
    ########################################
    /opt/kafka/bin/kafka-producer-perf-test.sh \
      --topic "${TOPIC}" \
      --num-records "${NUM_RECORDS}" \
      --throughput "${THROUGHPUT}" \
      --record-size "${RECORD_SIZE}" \
      --producer-props acks=1 bootstrap.servers="${BROKER}"