apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-load-script
  namespace: kafka

data:
  producer.sh: |
    #!/bin/bash
    set -e

    TOPIC="${TOPIC:-load-test-topic}"
    BROKER="${BROKER:-kafka-cluster-kafka-bootstrap:9092}"
    SCENARIO="${SCENARIO:-normal}"

    THROUGHPUT="${THROUGHPUT:--1}"
    RECORD_SIZE="${RECORD_SIZE:-1024}"
    NUM_RECORDS="${NUM_RECORDS:-10000000}"

    echo "Starting Kafka load test"
    echo "Scenario: ${SCENARIO}"
    echo "Broker: ${BROKER}"
    echo "Topic: ${TOPIC}"

    ########################################
    # BREAKDOWN SCENARIO
    ########################################
    if [ "$SCENARIO" = "breakdown" ]; then
    echo "Running BREAKDOWN scenario (continuous ramp)"
  
    RATE=1000
    STEP=200
    INTERVAL=10   # seconds per measurement window
  
    while [ "$RATE" -le 64000 ]
    do
      echo "Current target rate: $RATE msg/s"
  
      /opt/kafka/bin/kafka-producer-perf-test.sh \
        --topic "${TOPIC}" \
        --num-records 100000000 \
        --throughput "${RATE}" \
        --record-size "${RECORD_SIZE}" \
        --producer-props acks=1 bootstrap.servers="${BROKER}" \
        > /tmp/breakdown.log 2>&1 &
  
      PID=$!
  
      sleep $INTERVAL
  
      kill $PID 2>/dev/null || true
  
      # smooth ramp (wichtig für "kontinuierlich")
      RATE=$((RATE * 110 / 100))  # +10% every step
  
      # optional: steiler machen wenn du schneller crash willst
      # STEP=$((STEP + 100))
    done
  
    echo "Breakdown finished"
    exit 0
    fi

    ########################################
    # ELSE: DEFAULT 
    ########################################
    /opt/kafka/bin/kafka-producer-perf-test.sh \
      --topic "${TOPIC}" \
      --num-records "${NUM_RECORDS}" \
      --throughput "${THROUGHPUT}" \
      --record-size "${RECORD_SIZE}" \
      --producer-props acks=1 bootstrap.servers="${BROKER}"