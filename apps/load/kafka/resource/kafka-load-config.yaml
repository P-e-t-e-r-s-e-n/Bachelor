apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-load-script
  namespace: kafka

data:
  producer.sh: |
    #!/bin/bash
    set -e

    TOPIC="${TOPIC:-load-test-topic}"
    BROKER="${BROKER:-kafka-cluster-kafka-bootstrap:9092}"
    SCENARIO="${SCENARIO:-normal}"

    THROUGHPUT="${THROUGHPUT:--1}"
    RECORD_SIZE="${RECORD_SIZE:-1024}"
    NUM_RECORDS="${NUM_RECORDS:-10000000}"

    echo "Starting Kafka load test"
    echo "Scenario: ${SCENARIO}"
    echo "Broker: ${BROKER}"
    echo "Topic: ${TOPIC}"

    ########################################
    # BREAKDOWN SCENARIO (SEQUENTIAL RAMP)
    ########################################
    if [ "$SCENARIO" = "breakdown" ]; then
      echo "Running BREAKDOWN scenario (sequential ramp)"
    
      RATE=1000
      MAX_RATE=64000
      MULTIPLIER=1.25   # exponentiell (1.2–1.5 ist ideal)
      DURATION=20       # seconds per step
    
      while (( $(echo "$RATE <= $MAX_RATE" | bc -l) ))
      do
        echo "========================================"
        echo "Running step with RATE=$RATE msg/s"
        echo "Duration: ${DURATION}s"
        echo "========================================"
    
        /opt/kafka/bin/kafka-producer-perf-test.sh \
          --topic "${TOPIC}" \
          --num-records 100000000 \
          --throughput "${RATE}" \
          --record-size "${RECORD_SIZE}" \
          --producer-props acks=1 bootstrap.servers="${BROKER}"
    
        echo "Finished step RATE=$RATE"
        echo ""
    
        # exponentieller Anstieg
        RATE=$(echo "$RATE * $MULTIPLIER" | bc -l)
        RATE=${RATE%.*}
      done
    
      echo "Breakdown finished"
      exit 0
    fi

    ########################################
    # ELSE: DEFAULT 
    ########################################
    /opt/kafka/bin/kafka-producer-perf-test.sh \
      --topic "${TOPIC}" \
      --num-records "${NUM_RECORDS}" \
      --throughput "${THROUGHPUT}" \
      --record-size "${RECORD_SIZE}" \
      --producer-props acks=1 bootstrap.servers="${BROKER}"